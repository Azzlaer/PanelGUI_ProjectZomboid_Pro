name: Build Windows EXE
on:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        shell: pwsh
        run: |
          python -m compileall -q main.py pz_features.py pz_backup.py pz_native.py tests
          python -m unittest discover -s tests -v
      - name: Install build dependency
        run: python -m pip install "pyinstaller>=6,<7"
      - name: Build one-file executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name PanelGUI_ProjectZomboid_Pro main.py
      - uses: actions/upload-artifact@v4
        with:
          name: PanelGUI_ProjectZomboid_Pro-Windows
          path: dist/PanelGUI_ProjectZomboid_Pro.exe
          if-no-files-found: error
          retention-days: 14
